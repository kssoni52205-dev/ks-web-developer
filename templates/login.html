<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | KS Web Developer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f8f6f1;
        }

        .login-box {
            width: min(400px, 90%);
            padding: 35px;

            background: white;
            border-radius: 22px;

            box-shadow: 0 20px 60px rgba(0,0,0,0.10);
        }

        .logo {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            border-radius: 15px;

            background: #181818;
            color: #d7ad63;

            font-size: 20px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 10px;

            margin-bottom: 18px;

            outline: none;
        }

        input:focus {
            border-color: #a67b39;
        }

        button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #181818;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a67b39;
        }

        .error {
            color: #b42318;
            background: #fff1f0;

            padding: 10px;
            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            KS
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            KS Web Developer Dashboard
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>
</html>
